version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: queueless
      POSTGRES_PASSWORD: ${DB_PASSWORD:-queueless}
      POSTGRES_DB: queueless
    ports:
      - "5432:5432"
    volumes:
      - queueless_pg_data:/var/lib/postgresql/data

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://queueless:${DB_PASSWORD:-queueless}@db:5432/queueless
    ports:
      - "8000:8000"

volumes:
  queueless_pg_data:
